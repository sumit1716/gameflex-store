<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LootDrop - GameFlex Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e31825;
            --ps5-blue: #1f6aff;
            --dark-bg: #05070c;
            --card-bg: #12141a;
            --text-light: #ffffff;
            --text-gray: #a3a3a3;
            --active-color: #e31825; /* Default PC */
            --active-glow: 0 0 25px rgba(227, 24, 37, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); overflow-x: hidden; }

        /* Navbar & Basic Setup */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(5, 7, 12, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.03); border-radius: 10px; border: 1px solid var(--primary-red); padding: 5px; }
        .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text .top { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; color: white; line-height: 1; letter-spacing: 1px; }
        .logo-text .bottom { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--primary-red); letter-spacing: 3.5px; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links li a { color: var(--text-light); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .nav-links li a:hover { color: var(--primary-red); }

        /* LootDrop Container */
        .gacha-container { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 5%; background: radial-gradient(circle at center, #1a1012 0%, var(--dark-bg) 70%); position: relative; transition: background 0.5s; }
        .gacha-container.ps-mode { background: radial-gradient(circle at center, #0a1128 0%, var(--dark-bg) 70%); }
        
        .gacha-header { text-align: center; margin-bottom: 30px; z-index: 10; }
        .gacha-header h1 { font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: var(--active-glow); color: white; margin-bottom: 10px; transition: 0.3s; }
        .gacha-header p { color: var(--text-gray); font-size: 16px; font-weight: 600; letter-spacing: 1px; }

        /* Platform Switcher */
        .platform-switch { display: flex; background: rgba(255,255,255,0.05); border-radius: 30px; padding: 5px; margin-bottom: 40px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; }
        .switch-btn { padding: 10px 30px; border: none; background: transparent; color: var(--text-gray); font-weight: 800; font-size: 14px; cursor: pointer; border-radius: 25px; transition: 0.3s; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .switch-btn.active-pc { background: var(--primary-red); color: white; box-shadow: 0 0 15px rgba(227, 24, 37, 0.5); }
        .switch-btn.active-ps { background: var(--ps5-blue); color: white; box-shadow: 0 0 15px rgba(31, 106, 255, 0.5); }

        /* The Box / Crate */
        .crate-area { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; margin-bottom: 40px; z-index: 10; }
        .crate-image { width: 220px; filter: drop-shadow(var(--active-glow)); transition: 0.3s; cursor: pointer; z-index: 5; }
        .crate-shadow { position: absolute; bottom: 10px; width: 150px; height: 20px; background: var(--active-color); filter: blur(20px); opacity: 0.6; border-radius: 50%; transition: 0.3s; }
        
        /* Shaking Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-2deg); }
            20% { transform: translate(-3px, 0px) rotate(2deg); filter: brightness(1.5) drop-shadow(var(--active-glow)); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(2deg); filter: brightness(2) drop-shadow(var(--active-glow)); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-2deg); }
            80% { transform: translate(-1px, -1px) rotate(2deg); filter: brightness(3) drop-shadow(var(--active-glow)); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .is-shaking { animation: shake 0.4s infinite; }

        /* Spin Button */
        .spin-btn { background: transparent; border: 2px solid var(--active-color); color: white; padding: 18px 50px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; position: relative; overflow: hidden; box-shadow: var(--active-glow); z-index: 10; }
        .spin-btn::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--active-color); transition: 0.4s; z-index: -1; }
        .spin-btn:hover::before { left: 0; }
        .spin-btn:hover { transform: scale(1.05); }

        /* Win Modal Overlay */
        .win-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: 0.5s; backdrop-filter: blur(10px); }
        .win-overlay.show { display: flex; opacity: 1; }
        .win-title { font-family: 'Orbitron', sans-serif; font-size: 40px; font-weight: 900; color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.6); margin-bottom: 30px; animation: fadeInUp 0.5s; text-transform: uppercase; }
        .won-game-card { width: 250px; background: var(--card-bg); border: 2px solid var(--active-color); border-radius: 12px; padding: 15px; text-align: center; box-shadow: var(--active-glow); animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .won-img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .won-name { font-size: 16px; font-weight: 800; color: white; margin-bottom: 5px; }
        .won-value { font-size: 12px; color: var(--text-gray); }
        .won-value span { color: #00e676; font-weight: 800; }
        .claim-vault-btn { margin-top: 30px; background: #00e676; color: black; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0,230,118,0.5); text-transform: uppercase; }
        .claim-vault-btn:hover { background: #00c853; transform: scale(1.05); }

        @keyframes scaleUp { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Payment Modal */
        .payment-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .payment-modal { background: linear-gradient(145deg, #12141a, #1a1d24); border: 2px solid var(--active-color); border-radius: 16px; padding: 35px 25px; width: 380px; text-align: center; position: relative; }
        .close-payment { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: none; color: var(--text-gray); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
        .qr-container { background: white; padding: 15px; border-radius: 12px; margin: 15px auto; width: 200px; height: 200px; border: 3px dashed var(--active-color); }
        .qr-container img { width: 100%; height: 100%; object-fit: contain; }
        .confirm-pay-btn { width: 100%; background: linear-gradient(90deg, #00c853, #00e676); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 15px; }

        @media (max-width: 768px) {
            .gacha-header h1 { font-size: 32px; }
            .crate-image { width: 180px; }
            .spin-btn { font-size: 16px; padding: 15px 30px; }
            .win-title { font-size: 28px; }
            .won-game-card { width: 200px; }
            .won-img { height: 220px; }
        }
    </style>
</head>
<body id="gachaBody">

    <nav class="navbar">
        <a href="index.html" class="logo">
            <div class="logo-icon"><img src="logo.png" alt="Logo"></div>
            <div class="logo-text"><span class="top">GAMEFLEX</span><span class="bottom">STORE</span></div>
        </a>
        <ul class="nav-links" style="margin-left:auto; margin-right:20px;">
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">My Vault</a></li>
        </ul>
    </nav>

    <!-- LootDrop Section -->
    <div class="gacha-container" id="gachaContainer">
        <div class="gacha-header">
            <h1 id="mainTitle">LootDrop Zone</h1>
            <p>Unlock Premium AAA Games. 1% Chance for Jackpot!</p>
        </div>

        <div class="platform-switch">
            <button class="switch-btn active-pc" id="pcBtn" onclick="switchPlatform('PC')"><i class="fa-solid fa-desktop"></i> PC</button>
            <button class="switch-btn" id="psBtn" onclick="switchPlatform('PS5')"><i class="fa-brands fa-playstation"></i> PS5</button>
        </div>

        <div class="crate-area">
            <!-- Crate image can be any box icon, using a generic box icon for demo -->
            <img src="https://cdn-icons-png.flaticon.com/512/3745/3745094.png" id="crateImg" class="crate-image" alt="Mystery Crate">
            <div class="crate-shadow" id="crateShadow"></div>
        </div>

        <button class="spin-btn" onclick="initiateSpin()" id="spinBtn">OPEN DROP (₹149)</button>
    </div>

    <!-- Payment Modal (Simulation) -->
    <div class="payment-overlay" id="paymentOverlay">
        <div class="payment-modal">
            <button class="close-payment" onclick="closePayment()"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="color: white; margin-bottom: 10px; font-family:'Orbitron', sans-serif;">Pay ₹149</h2>
            <p style="color: gray; font-size:12px;">Scan to purchase LootDrop Token</p>
            <div class="qr-container">
                <img id="dynamicQRCode" src="" alt="Scan & Pay UPI QR">
            </div>
            <button class="confirm-pay-btn" id="confirmPaymentBtn" onclick="processPaymentAndSpin()">
                <i class="fa-solid fa-check-circle"></i> I HAVE PAID
            </button>
        </div>
    </div>

    <!-- Win Result Overlay -->
    <div class="win-overlay" id="winOverlay">
        <div class="win-title" id="winTitleText">JACKPOT!</div>
        <div class="won-game-card">
            <img src="" id="wonImg" class="won-img" alt="Won Game">
            <div class="won-name" id="wonName">Game Name</div>
            <div class="won-value">Store Value: <span id="wonValue">₹2999</span></div>
        </div>
        <button class="claim-vault-btn" onclick="claimToVault()">Claim to Digital Vault <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPuUj6nJZxhsJCJLrsyPwghLhUhS5_4_0",
            authDomain: "gameflexstore-d20da.firebaseapp.com",
            projectId: "gameflexstore-d20da"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            if (user) { currentUser = user; }
        });

        // The Loot Pool Database
        const lootDatabase = {
            PC: [
                { title: "Grand Theft Auto VI (Pre-Order)", value: 3999, img: "https://images.unsplash.com/photo-1605901309584-818e25960b8f?auto=format&fit=crop&w=300&q=80", tier: "JACKPOT", chance: 1 },
                { title: "Cyberpunk 2077: Ultimate Edition", value: 1499, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80", tier: "EPIC", chance: 9 },
                { title: "Red Dead Redemption 2", value: 999, img: "https://images.unsplash.com/photo-1616423640778-28d1b53229bd?auto=format&fit=crop&w=300&q=80", tier: "RARE", chance: 30 },
                { title: "Hollow Knight", value: 450, img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80", tier: "COMMON", chance: 60 }
            ],
            PS5: [
                { title: "Spider-Man 2", value: 3500, img: "https://images.unsplash.com/photo-1605901309584-818e25960b8f?auto=format&fit=crop&w=300&q=80", tier: "JACKPOT", chance: 1 },
                { title: "God of War Ragnarok", value: 1999, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80", tier: "EPIC", chance: 9 },
                { title: "Ghost of Tsushima", value: 1200, img: "https://images.unsplash.com/photo-1616423640778-28d1b53229bd?auto=format&fit=crop&w=300&q=80", tier: "RARE", chance: 30 },
                { title: "Stray", value: 500, img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80", tier: "COMMON", chance: 60 }
            ]
        };

        window.currentPlatform = "PC";
        window.wonGameData = null;

        window.switchPlatform = function(platform) {
            window.currentPlatform = platform;
            const body = document.getElementById('gachaBody');
            const container = document.getElementById('gachaContainer');
            const pcBtn = document.getElementById('pcBtn');
            const psBtn = document.getElementById('psBtn');

            if(platform === 'PC') {
                document.documentElement.style.setProperty('--active-color', '#e31825');
                document.documentElement.style.setProperty('--active-glow', '0 0 25px rgba(227, 24, 37, 0.6)');
                container.classList.remove('ps-mode');
                pcBtn.classList.add('active-pc'); psBtn.classList.remove('active-ps');
            } else {
                document.documentElement.style.setProperty('--active-color', '#1f6aff');
                document.documentElement.style.setProperty('--active-glow', '0 0 25px rgba(31, 106, 255, 0.6)');
                container.classList.add('ps-mode');
                psBtn.classList.add('active-ps'); pcBtn.classList.remove('active-pc');
            }
        };

        window.initiateSpin = function() {
            if (!currentUser) {
                alert("Please login first to play LootDrop!");
                window.location.href = "index.html";
                return;
            }
            // Generate QR for Payment
            const upiString = `upi://pay?pa=8307105368@fam&pn=GameFlexStore&am=149&cu=INR`;
            document.getElementById('dynamicQRCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
            document.getElementById('paymentOverlay').style.display = 'flex';
        };

        window.closePayment = function() {
            document.getElementById('paymentOverlay').style.display = 'none';
        };

        window.processPaymentAndSpin = function() {
            const btn = document.getElementById('confirmPaymentBtn');
            btn.innerText = "Verifying..."; btn.disabled = true;

            // Simulate verification delay
            setTimeout(() => {
                closePayment();
                btn.innerText = "I HAVE PAID"; btn.disabled = false;
                startGachaAnimation();
            }, 1500);
        };

        function startGachaAnimation() {
            const crate = document.getElementById('crateImg');
            const btn = document.getElementById('spinBtn');
            btn.innerText = "DECRYPTING DROP...";
            btn.style.pointerEvents = "none";
            
            // Add shaking class
            crate.classList.add('is-shaking');

            // Wait 3 seconds for suspense
            setTimeout(() => {
                crate.classList.remove('is-shaking');
                pickRandomGame();
            }, 3000);
        }

        function pickRandomGame() {
            const pool = lootDatabase[window.currentPlatform];
            const rand = Math.random() * 100;
            let cumulative = 0;
            let selected = pool[pool.length - 1]; // Fallback to common

            for(let i=0; i<pool.length; i++) {
                cumulative += pool[i].chance;
                if(rand <= cumulative) {
                    selected = pool[i];
                    break;
                }
            }

            window.wonGameData = selected;
            showWinScreen(selected);
        }

        function showWinScreen(game) {
            document.getElementById('wonImg').src = game.img;
            document.getElementById('wonName').innerText = game.title;
            document.getElementById('wonValue').innerText = `₹${game.value}`;
            
            const titleText = document.getElementById('winTitleText');
            if(game.tier === "JACKPOT") { titleText.innerText = "🎰 MEGA JACKPOT! 🎰"; titleText.style.color = "#FFD700"; }
            else if(game.tier === "EPIC") { titleText.innerText = "🔥 EPIC DROP 🔥"; titleText.style.color = "#ff3333"; }
            else if(game.tier === "RARE") { titleText.innerText = "✨ RARE ITEM ✨"; titleText.style.color = "#1f6aff"; }
            else { titleText.innerText = "📦 DROP SECURED 📦"; titleText.style.color = "white"; }

            document.getElementById('winOverlay').classList.add('show');
            document.getElementById('spinBtn').innerText = "OPEN DROP (₹149)";
            document.getElementById('spinBtn').style.pointerEvents = "auto";
        }

        window.claimToVault = async function() {
            if(!currentUser || !window.wonGameData) return;
            
            const btn = document.querySelector('.claim-vault-btn');
            btn.innerText = "Saving to Vault..."; btn.disabled = true;

            try {
                // Save directly to Firebase bookings so it shows in profile.html "Digital Vault"
                await addDoc(collection(db, "bookings"), {
                    userId: currentUser.uid, 
                    userEmail: currentUser.email,
                    items: [{
                        title: `${window.wonGameData.title} (LootDrop Win)`, 
                        price: 149, // Amount paid
                        qty: 1,
                        img: window.wonGameData.img
                    }], 
                    totalAmount: 149, 
                    status: "Verified", 
                    createdAt: serverTimestamp()
                });

                alert("Game Added to your Digital Vault! You can view it in your Profile.");
                window.location.href = "profile.html";
            } catch (err) {
                console.error(err);
                alert("Error claiming game. Please contact support.");
                btn.innerText = "Claim to Digital Vault"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
