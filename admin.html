<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GameFlex</title>
    <!-- CSS WAHI RAKHNA HAI JO PICHLE CODE MEIN THA -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* KEEP ALL PREVIOUS ADMIN CSS HERE */
        :root { --primary-red: #e31825; --dark-bg: #0b0c10; --card-bg: #12141a; --border-dark: #2a2a30; --text-light: #ffffff; --text-gray: #a3a3a3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); }
        #loginScreen { display: flex; height: 100vh; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .admin-login-btn { background: var(--primary-red); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        #adminDashboard { display: none; }
        .admin-nav { display: flex; justify-content: space-between; padding: 20px 5%; background: var(--card-bg); border-bottom: 1px solid var(--border-dark); align-items: center;}
        .container { padding: 30px 5%; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-dark); padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; }
        .stat-icon { font-size: 30px; color: var(--primary-red); background: rgba(227, 24, 37, 0.1); padding: 15px; border-radius: 8px; }
        .live-dot { height: 10px; width: 10px; background-color: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .graph-panel { background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 10px; padding: 20px; margin-bottom: 40px; }
        .graph-container { position: relative; height: 300px; width: 100%; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .panel { background: var(--card-bg); border: 1px solid var(--border-dark); border-radius: 10px; padding: 20px; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th { color: var(--primary-red); padding: 12px 10px; border-bottom: 1px solid var(--border-dark); position: sticky; top: 0; background: var(--card-bg); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border-dark); color: var(--text-gray); }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h1 style="color: var(--primary-red);"><i class="fa-solid fa-lock"></i> ADMIN SECURE LOGIN</h1>
        <button class="admin-login-btn" id="adminLoginBtn"><i class="fa-brands fa-google"></i> Login as Admin</button>
        <p id="errorMsg" style="color: red; margin-top: 10px; display: none;"></p>
    </div>

    <div id="adminDashboard">
        <nav class="admin-nav">
            <h2><i class="fa-solid fa-shield-halved"></i> GameFlex Portal</h2>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="adminName"></span>
                <button id="logoutBtn" style="background:none; border:1px solid white; color:white; padding:5px 10px; cursor:pointer;">Logout</button>
            </div>
        </nav>

        <div class="container">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <div><h4 style="color:gray; font-size:12px;"><span class="live-dot"></span> LIVE USERS</h4><h2 id="liveUserCount">0</h2></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                    <div><h4 style="color:gray; font-size:12px;">TOTAL BOOKINGS</h4><h2 id="totalOrdersCount">0</h2></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
                    <div><h4 style="color:gray; font-size:12px;">TOTAL REVENUE</h4><h2 id="totalRevenueCount">₹0</h2></div>
                </div>
            </div>

            <div class="graph-panel">
                <h3 style="margin-bottom:10px;"><i class="fa-solid fa-chart-line" style="color: var(--primary-red);"></i> Real-Time Store Activity</h3>
                <div class="graph-container"><canvas id="reachChart"></canvas></div>
            </div>

            <div class="grid-layout">
                <div class="panel">
                    <h3>Registered Members</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <!-- NEW COLUMN -->
                                <th>Tokens</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>

                <div class="panel">
                    <h3>Recent Bookings</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Items</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPuUj6nJZxhsJCJLrsyPwghLhUhS5_4_0",
            authDomain: "gameflexstore-d20da.firebaseapp.com",
            projectId: "gameflexstore-d20da",
            storageBucket: "gameflexstore-d20da.firebasestorage.app",
            messagingSenderId: "108900412542",
            appId: "1:108900412542:web:8a2bd0114fc2037164fc2f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "sumitroman198@gmail.com"; 
        Chart.defaults.color = '#a3a3a3'; Chart.defaults.borderColor = '#2a2a30';
        let myChart = null;

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('reachChart').getContext('2d');
            let gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(227, 24, 37, 0.5)'); 
            gradient.addColorStop(1, 'rgba(227, 24, 37, 0.0)');
            if(myChart) myChart.destroy(); 
            myChart = new Chart(ctx, {
                type: 'line', data: { labels: labels, datasets: [{ data: dataPoints, borderColor: '#e31825', backgroundColor: gradient, fill: true, tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { suggestedMax: 5 } } }
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminDashboard').style.display = "block";
                document.getElementById('adminName').innerText = "Admin: " + user.displayName;
                startRealtimeListeners();
            } else if (user) {
                signOut(auth);
                document.getElementById('errorMsg').style.display = "block";
                document.getElementById('errorMsg').innerText = "Access Denied.";
            } else {
                document.getElementById('loginScreen').style.display = "flex";
                document.getElementById('adminDashboard').style.display = "none";
            }
        });

        document.getElementById('adminLoginBtn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        function startRealtimeListeners() {
            // USERS LISTENER (Updated for Tokens)
            onSnapshot(query(collection(db, "users")), (snapshot) => {
                const table = document.getElementById('usersTableBody');
                table.innerHTML = "";
                let liveCount = 0; const now = new Date();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.lastLogin && Math.abs(now - data.lastLogin.toDate()) / 36e5 <= 24) liveCount++;
                    
                    // Display Tokens dynamically
                    table.innerHTML += `
                        <tr>
                            <td style="color: white; font-weight: 600;">${data.name || 'Unknown'}</td>
                            <td>${data.email}</td>
                            <td style="color: gold; font-weight: 800;"><i class="fa-solid fa-coins"></i> ${data.tokens || 0}</td>
                        </tr>`;
                });
                document.getElementById('liveUserCount').innerText = liveCount > 0 ? liveCount : 1;
            });

            // BOOKINGS LISTENER
            onSnapshot(query(collection(db, "bookings"), orderBy("createdAt", "desc")), (snapshot) => {
                const table = document.getElementById('bookingsTableBody');
                table.innerHTML = "";
                let totalRev = 0, totalOrders = 0;
                let graphData = { labels: ["Apr", "May", "Jun", "Jul", "Aug", "Sep"], dataPoints: [0,0,0,0,0,0] };

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    totalOrders++; totalRev += Number(data.totalAmount || 0);
                    if(data.createdAt) graphData.dataPoints[5] += 1; // Simplification for demo
                    
                    let itemsString = data.items ? data.items.map(i => `${i.title}`).join(', ') : "Manual";
                    table.innerHTML += `<tr><td style="color: white;">${data.userEmail}</td><td>${itemsString}</td><td style="color: var(--primary-red); font-weight: 800;">₹${data.totalAmount}</td></tr>`;
                });
                document.getElementById('totalOrdersCount').innerText = totalOrders;
                document.getElementById('totalRevenueCount').innerText = '₹' + totalRev;
                renderChart(graphData.labels, graphData.dataPoints);
            });
        }
    </script>
</body>
</html>
